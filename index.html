<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Stars Training Camp</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#bfe6ff; --bg2:#fff3cf; --ink:#25262b; --muted:#6a6f7a;
  --panel:#ffffff; --panel2:#f2f4f8; --line:#d9dde6;
  --stars:#1f5fd6; --suns:#f08a24; --accent:#ff7a1a; --good:#2e9f5b; --bad:#d64545;
  --floor1:#e8b96b; --floor2:#d79d4a; --sky1:#9fd8ff; --sky2:#e9f7ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#0e1830; --bg2:#1a2c4d; --ink:#f2f3f6; --muted:#a9b3c7;
    --panel:#1e2d4a; --panel2:#2a3b5f; --line:#3c5079;
    --stars:#5b97ff; --suns:#ffa04a; --floor1:#9a7a3f; --floor2:#85672f; --sky1:#1d3f6e; --sky2:#27507f;
  }
}
:root[data-theme="dark"]{
  --bg1:#0e1830; --bg2:#1a2c4d; --ink:#f2f3f6; --muted:#a9b3c7;
  --panel:#1e2d4a; --panel2:#2a3b5f; --line:#3c5079;
  --stars:#5b97ff; --suns:#ffa04a; --floor1:#9a7a3f; --floor2:#85672f; --sky1:#1d3f6e; --sky2:#27507f;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column}
#bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px}
#bar h1{margin:0;font-size:19px;white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
#screen{flex:1;min-height:0;overflow:auto;padding:4px 12px 14px}
.center{text-align:center}
/* start */
.card{background:var(--panel);border-radius:24px;padding:18px 20px;max-width:760px;margin:6px auto;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.title{font-size:clamp(28px,5vw,44px);font-weight:900;color:var(--stars);margin:4px 0}
.sub{font-size:clamp(15px,2.2vw,19px);color:var(--muted);margin:0 0 8px}
.rowlab{font-weight:800;font-size:19px;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:6px 12px 6px 6px;font-size:19px;font-weight:700}
.chip svg{width:34px;height:34px}
.chip.on-good{border-color:var(--good);background:#d6f3e0;color:#0f5a2d}
.chip.on-bad{border-color:var(--bad);background:#ffe0e0;color:#7a1c1c}
.nameRow{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:800}
.nameRow input{font-size:20px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);min-width:0;width:200px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.modebtn{border:0;border-radius:20px;padding:14px 10px;color:#fff;font-weight:900;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.modebtn small{display:block;font-size:15px;font-weight:600;opacity:.95;margin-top:4px}
.m-mix{background:linear-gradient(#ff8a3d,#f0561d)} .m-can{background:linear-gradient(#3b8fe8,#1f5fd6)} .m-good{background:linear-gradient(#37c36f,#1f9a52)}
/* game */
#game{display:grid;gap:10px;max-width:1100px;margin:0 auto}
@media (min-width:900px) and (min-aspect-ratio:5/4){#game{grid-template-columns:1fr 1.15fr;align-items:start}}
#left{display:flex;flex-direction:column;gap:8px}
#score{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--panel);border-radius:18px;padding:6px 12px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.team{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(17px,2.6vw,24px)}
.team b{flex:none;font-size:clamp(28px,4.4vw,42px);min-width:1.2em;text-align:center;border-radius:12px;padding:0 8px;color:#fff}
.team.stars b{background:var(--stars)} .team.suns b{background:var(--suns)}
.team .pop{animation:pop .6s ease}
.team.active{box-shadow:0 0 0 4px var(--accent);border-radius:16px;padding:2px 10px}
.team .tn{max-width:5.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn{display:inline-block;color:#fff;font-weight:900;border-radius:999px;padding:4px 18px;font-size:clamp(17px,2.6vw,22px);margin-bottom:8px}
.chip.on-play{border-color:var(--stars);background:#dbe8ff;color:#12388a}
.chip.play{padding:10px 16px;font-size:20px}
.chip small{display:block;font-size:13px;font-weight:600;opacity:.85}
@keyframes pop{30%{transform:scale(1.5)}100%{transform:scale(1)}}
#score .vs{font-size:14px;color:var(--muted);font-weight:700;text-align:center;line-height:1.25;white-space:nowrap;flex:none}
#score{flex-wrap:nowrap;gap:10px}
.team{min-width:0}
#courtWrap{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.1)}
#courtSvg{display:block;width:100%;height:auto}
#flash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(28px,6vw,56px);font-weight:900;color:#fff;
  padding:6px 26px;border-radius:24px;text-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;pointer-events:none;white-space:nowrap}
#flash.show{animation:flash 1.2s ease forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}
#courtBox{position:relative}
#net.swish{animation:swish .5s ease}
@keyframes swish{30%{transform:scaleY(1.25)}60%{transform:scaleY(.9)}}
#net{transform-origin:316px 96px;transform-box:view-box}
#qcard{background:var(--panel);border-radius:22px;padding:14px 16px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.qprompt{font-size:clamp(15px,2.2vw,19px);font-weight:800;color:var(--muted);margin-bottom:6px}
.qstem{font-size:clamp(24px,4.2vw,38px);font-weight:800;line-height:1.3;margin:6px 0 12px}
.blank{display:inline-block;min-width:3.2em;border-bottom:5px solid var(--ink);vertical-align:bottom}
.fill{display:inline-block;background:#fff2a8;color:#3b2b00;border-radius:10px;padding:0 10px}
.fill.good{background:#c8f2d4;color:#0f5a2d} .fill.bad{background:#ffd0d0;color:#7a1c1c}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:clamp(20px,3.2vw,28px);font-weight:700;padding:11px 16px;border-radius:18px;border:4px solid var(--line);background:var(--panel2)}
.opt .lt{flex:none;width:38px;height:38px;border-radius:50%;background:var(--stars);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.opt:hover:not(:disabled){border-color:var(--stars)}
.opt.good{border-color:var(--good);background:#d3f5de;color:#0f5a2d}
.opt.bad{border-color:var(--bad);background:#ffdcdc;color:#7a1c1c;animation:nope .35s}
.opt.hint{outline:5px dashed var(--good)}
.opt:disabled{cursor:default}
@keyframes nope{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:36px;margin-top:10px;font-size:clamp(20px,3vw,26px);font-weight:900;text-align:center}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.ghost{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:7px 16px;font-size:16px;font-weight:700}
.ghost.sm{font-size:13px;padding:4px 10px;opacity:.85}
.big{border:0;border-radius:999px;padding:12px 34px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#37c36f,#1f9a52);box-shadow:0 5px 0 #146b38}
.big.orange{background:linear-gradient(#ff8a3d,#f0561d);box-shadow:0 5px 0 #b83b0c}
/* player card */
.pcard{display:flex;align-items:center;gap:14px;background:var(--panel2);border-radius:18px;padding:8px 14px;margin-bottom:8px}
.pcard .pname{font-size:clamp(20px,3vw,28px);font-weight:900}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mk{display:flex;align-items:center;gap:4px;border-radius:12px;padding:3px 10px 3px 4px;background:var(--panel);font-weight:800;font-size:17px;border:2px solid var(--line)}
.mk svg{width:28px;height:28px}
.mk .b{font-size:20px;font-weight:900}
.mk.s .b{color:#d99a00} .mk.c .b{color:var(--good)} .mk.x .b{color:var(--bad)}
.legend{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
/* build */
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;min-height:56px}
.slot{min-width:64px;height:52px;border-bottom:5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.4vw,30px);font-weight:800;padding:0 8px}
.slot.f{background:#c8f2d4;border-radius:10px 10px 0 0;color:#0f5a2d}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.tile{border:4px solid var(--stars);background:var(--panel);border-radius:16px;padding:8px 18px;font-size:clamp(20px,3.4vw,30px);font-weight:800}
.tile:disabled{opacity:.25;cursor:default}
.tile.shake{animation:nope .35s;border-color:var(--bad)}
/* who */
.bubble{background:var(--panel2);border-radius:20px;padding:12px 16px;font-size:clamp(20px,3.4vw,30px);font-weight:800;line-height:1.35;margin:6px 0 12px}
.whoopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;border:4px solid var(--line);border-radius:18px;background:var(--panel2);padding:8px 6px;font-size:21px;font-weight:900}
.who:hover:not(:disabled){border-color:var(--stars)}
.who.good{border-color:var(--good);background:#d3f5de;color:#0f5a2d} .who.bad{border-color:var(--bad);background:#ffdcdc;color:#7a1c1c;animation:nope .35s}
.who.hint{outline:5px dashed var(--good)}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.endcard{max-width:560px;margin:18px auto;text-align:center}
.endcard .big{margin:6px}
.stat{font-size:21px;font-weight:700;margin:6px 0}
@media (max-width:640px){#bar h1{font-size:15px}.tools button{font-size:12px;padding:4px 8px}#score{position:sticky;top:0;z-index:5}#courtSvg{max-height:22vh}#left{gap:6px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-run" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="31" cy="9" r="4.5"/><path d="M29 14 L24 28 M28 17 L37 21 M28 17 L19 21 M24 28 L33 37 M24 28 L15 35 L10 33"/><path d="M8 18 H14 M5 24 H12" opacity=".55"/></g></symbol>
    <symbol id="ic-jump" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="9" r="4.5"/><path d="M24 14 L24 28 M24 17 L14 8 M24 17 L34 8 M24 28 L16 36 M24 28 L32 36"/><path d="M8 43 H40" opacity=".55"/></g></symbol>
    <symbol id="ic-throw" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="10" r="4.5"/><path d="M16 15 L16 29 M16 18 L30 12 M16 18 L8 25 M16 29 L10 41 M16 29 L24 41"/></g><circle cx="38" cy="10" r="5" fill="#ff7a1a" stroke="#b34a00" stroke-width="1.5"/></symbol>
    <symbol id="ic-catch" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="10" r="4.5"/><path d="M13 15 L13 29 M13 19 L27 23 M13 19 L26 17 M13 29 L7 41 M13 29 L21 41"/></g><circle cx="35" cy="20" r="5" fill="#ff7a1a" stroke="#b34a00" stroke-width="1.5"/><path d="M42 14 H46 M43 20 H47" stroke="currentColor" stroke-width="2" opacity=".5"/></symbol>
    <symbol id="ic-bounce" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="8" r="4.5"/><path d="M15 13 L15 27 M15 17 L24 27 M15 27 L9 39 M15 27 L22 39"/><path d="M8 45 H40" opacity=".55"/></g><circle cx="29" cy="37" r="5" fill="#ff7a1a" stroke="#b34a00" stroke-width="1.5"/></symbol>
  </defs>
</svg>
<div id="app">
  <div id="bar"><h1>Five Stars Training Camp</h1>
    <div class="tools"><button id="btnVoice" type="button">Voice: On</button><button id="btnSound" type="button">Sound: On</button><button id="btnMenu" type="button">Menu</button></div></div>
  <div id="screen"></div>
</div>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const SPEEDK = () => (window.__speed || 1);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms * SPEEDK()));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const GOAL = 5, MAXROUNDS = 15, MAXTURNS = 24;

/* ---------------- language data ---------------- */
const VERBS = {
  catch:  { base: "catch",  ing: "catching",  s: "catches", comp: " the ball", icon: "ic-catch" },
  throw:  { base: "throw",  ing: "throwing",  s: "throws",  comp: " the ball", icon: "ic-throw" },
  bounce: { base: "bounce", ing: "bouncing",  s: "bounces", comp: " the ball", icon: "ic-bounce" },
  jump:   { base: "jump",   ing: "jumping",   s: "jumps",   comp: "",          icon: "ic-jump" },
  run:    { base: "run",    ing: "running",   s: "runs",    comp: " fast",     icon: "ic-run" },
  swim:   { base: "swim",   ing: "swimming",  s: "swims",   comp: "" },
  dance:  { base: "dance",  ing: "dancing",   s: "dances",  comp: "" },
  sing:   { base: "sing",   ing: "singing",   s: "sings",   comp: "" },
  ride:   { base: "ride",   ing: "riding",    s: "rides",   comp: "" },
  draw:   { base: "draw",   ing: "drawing",   s: "draws",   comp: "" },
  kick:   { base: "kick",   ing: "kicking",   s: "kicks",   comp: " the ball" },
  read:   { base: "read",   ing: "reading",   s: "reads",   comp: "" },
};
const MAIN5 = ["catch", "throw", "bounce", "jump", "run"];
const ALLV = Object.keys(VERBS);
const SUBJECTS = [
  { t: "I", be: "am", gb: "I'm" }, { t: "You", be: "are", gb: "You are" }, { t: "He", be: "is", gb: "He is" }, { t: "She", be: "is", gb: "She is" },
  { t: "We", be: "are", gb: "We are" }, { t: "They", be: "are", gb: "They are" },
  { t: "Alex", be: "is", gb: "Alex is" }, { t: "Jill", be: "is", gb: "Jill is" }, { t: "Tom", be: "is", gb: "Tom is" },
  { t: "Kim and Jim", be: "are", gb: "Kim and Jim are" }, { t: "The Five Stars", be: "are", gb: "The Five Stars are" }, { t: "Alice and Dan", be: "are", gb: "Alice and Dan are" },
];
const LOOKS = {
  alex: { hair: "#c0392b", style: "spiky" }, jill: { hair: "#7b4a2d", style: "long" }, kim: { hair: "#3d2b1f", style: "short" },
  jim: { hair: "#e6b422", style: "short" }, tom: { hair: "#222222", style: "curly" }, kimjim: { hair: "#3d2b1f", style: "short" }, me: { hair: "#f1b82d", style: "long" },
};
const STORY_CARDS = [
  { id: "alex", name: "Alex", subj: "Alex", gb: "Alex is", marks: { throw: "\u2605", catch: "\u2717" } },
  { id: "jill", name: "Jill", subj: "Jill", gb: "Jill is", marks: { run: "\u2713", throw: "\u2717", jump: "\u2717" } },
  { id: "kim", name: "Kim", subj: "Kim", gb: "Kim is", marks: { catch: "\u2605", run: "\u2717" } },
  { id: "jim", name: "Jim", subj: "Jim", gb: "Jim is", marks: { catch: "\u2605", run: "\u2717" } },
  { id: "tom", name: "Tom", subj: "Tom", gb: "Tom is", marks: { bounce: "\u2605", catch: "\u2605", throw: "\u2605", jump: "\u2605", run: "\u2605" } },
];
// "Who is it?" statements (story facts, first person)
const WHO_ITEMS = [
  { s: "I can't catch the ball, but I'm very good at throwing.", who: "alex", focus: "both" },
  { s: "I can't throw or jump, but I can run very fast.", who: "jill", focus: "can" },
  { s: "We can't run fast, but we're very good at catching.", who: "kimjim", focus: "both" },
  { s: "I'm good at bouncing, catching, throwing, jumping and running!", who: "tom", focus: "good" },
];
const WHO_NAMES = { alex: "Alex", jill: "Jill", kimjim: "Kim and Jim", tom: "Tom" };

/* ---------------- statements ---------------- */
function mkCan(card, vk, neg) {
  const v = VERBS[vk], subj = card.subj;
  const text = `${subj} ${neg ? "can't" : "can"} ${v.base}${v.comp}.`;
  return { type: "can", neg, vk, text, bad() { const f = pick([v.ing, v.s]); return `${subj} ${neg ? "can't" : "can"} ${f}${v.comp}.`; } };
}
function mkGood(card, vk) {
  const v = VERBS[vk], gb = card.gb;
  return { type: "good", neg: false, vk, text: `${gb} good at ${v.ing}.`, bad() { const f = pick([v.base, "to " + v.base]); return `${gb} good at ${f}.`; } };
}
function statementsFor(card) {
  const T = [], F = [];
  for (const [vk, m] of Object.entries(card.marks)) {
    if (m === "\u2605") { T.push(mkCan(card, vk, false)); T.push(mkGood(card, vk)); F.push(mkCan(card, vk, true)); }
    else if (m === "\u2713") { T.push(mkCan(card, vk, false)); F.push(mkCan(card, vk, true)); }
    else if (m === "\u2717") { T.push(mkCan(card, vk, true)); F.push(mkCan(card, vk, false)); F.push(mkGood(card, vk)); }
  }
  return { T, F };
}

/* ---------------- question generators ---------------- */
function compOf(vk) { return VERBS[vk].comp; }
function qFormCan() {
  const S = pick(SUBJECTS), vk = pick(ALLV), v = VERBS[vk], neg = Math.random() < 0.4;
  const third = Math.random() < 0.5 ? v.s : "to " + v.base;
  const opts = shuffle([v.base, v.ing, third]);
  const full = `${S.t} ${neg ? "can't" : "can"} ${v.base}${v.comp}.`;
  return { key: "fc:" + full, kind: "choice", focus: "can", prompt: "Choose the right word.",
    pre: `${S.t} ${neg ? "can't" : "can"} `, post: `${v.comp}.`, opts, ans: opts.indexOf(v.base), full };
}
function qFormGood() {
  const S = pick(SUBJECTS), vk = pick(ALLV), v = VERBS[vk];
  const opts = shuffle([v.ing, v.base, "to " + v.base]);
  const full = `${S.gb} good at ${v.ing}.`;
  return { key: "fg:" + full, kind: "choice", focus: "good", prompt: "Choose the right word.",
    pre: `${S.gb} good at `, post: ".", opts, ans: opts.indexOf(v.ing), full };
}
function qBe() {
  const S = pick(SUBJECTS), v = VERBS[pick(ALLV)];
  const opts = shuffle(["am", "is", "are"]);
  const full = `${S.t} ${S.be} good at ${v.ing}.`;
  return { key: "be:" + full, kind: "choice", focus: "good", prompt: "Choose the right word.",
    pre: `${S.t} `, post: ` good at ${v.ing}.`, opts, ans: opts.indexOf(S.be), full };
}
function qTrue(mode, myCard) {
  const cards = [...STORY_CARDS, ...(myCard && Object.keys(myCard.marks).length ? [myCard, myCard] : [])];
  const card = pick(cards), { T, F } = statementsFor(card);
  const allowT = T.filter((s) => mode === "mix" || s.type === mode);
  if (!allowT.length) return null;
  const t = pick(allowT);
  let Fs = F.filter((s) => s.type === t.type && s.text !== t.text);

  const net = $("#net"), from = team === 1 ? BALL1 : BALL0, arc = team === 1 ? 45 : 70;
  const bump = (id) => { const el = $(id); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); };
  const who = G.twoPlayer ? G.names[team] : "";
  if (outcome === "goal") {
    await animBall(from, RIM, 750, arc); sfx("goal");
    net.classList.remove("swish"); void net.getBBox(); net.classList.add("swish");
    await animBall(RIM, NET_END, 260, 0);
    if (team === 0) { G.stars += 1; $("#sS").textContent = G.stars; bump("#sS"); } else { G.suns += 1; $("#sU").textContent = G.suns; bump("#sU"); }
    await flash("GOAL!", team === 0 ? "var(--stars)" : "var(--suns)");
  } else if (outcome === "rim") {
    await animBall(from, RIM, 700, arc); sfx("rim");
    await animBall(RIM, [352, 160], 450, 45);
    await flash("So close!", "#8a8f99");
  } else if (outcome === "miss") {
    await animBall(from, [team === 1 ? 200 : 190, 196], 650, 40); sfx("steal");
    await flash("Miss!", "#8a8f99");
  } else {
    await animBall(BALL0, SUNS_P, 450, 24); sfx("steal");
    G.suns += 1; bump("#sU"); $("#sU").textContent = G.suns;
    await flash("Suns steal!", "var(--suns)");
  }
  setBall(...BALL0);
}

function confetti() {
  const cols = ["#ff6b6b", "#ffd43b", "#51cf66", "#339af0", "#cc5de8", "#ffa94d"];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = cols[i % cols.length];
    d.style.animationDuration = 2.5 + Math.random() * 2.5 + "s"; d.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(d); setTimeout(() => d.remove(), 7000);
  }
}
function endGame() {
  G.over = true;
  const two = G.twoPlayer, mode = G.mode;
  let winnerIdx = G.stars > G.suns ? 0 : G.suns > G.stars ? 1 : -1;
  const n0 = two ? G.names[0] : "Stars", n1 = two ? G.names[1] : "Suns";
  const win = winnerIdx === 0;
  if (winnerIdx >= 0 && (win || two)) { sfx("win"); confetti(); } else sfx("steal");
  let title, msg;
  if (two) {
    title = winnerIdx < 0 ? "It's a draw!" : `${esc(G.names[winnerIdx])} wins!`;
    msg = winnerIdx < 0 ? "What a close game!" : winnerIdx === 0 ? "The Five Stars are the winners!" : "The Suns are the winners! Great game!";
  } else {
    title = win ? `${esc(myName)} wins!` : winnerIdx < 0 ? "It's a draw!" : "The Suns win this time!";
    msg = win ? "The Five Stars are the winners!" : winnerIdx < 0 ? "What a close game!" : "So close! Let's play again.";
  }
  const rounds = G.round, first = G.firstTry;
  const rating = !two && win ? (G.suns === 0 ? 3 : first >= rounds * 0.6 ? 2 : 1) : 0;
  const stats = two
    ? `<div class="stat">${esc(n0)} ${G.stars} \u2014 ${G.suns} ${esc(n1)}</div><div class="stat">Right on the first try: ${esc(n0)} ${G.ft[0]}, ${esc(n1)} ${G.ft[1]}</div>`
    : `<div class="stat">Stars ${G.stars} \u2014 ${G.suns} Suns</div><div class="stat">Right on the first try: ${first} of ${rounds}</div>`;
  $("#qcard").innerHTML = `<div class="endcard"><div style="font-size:64px">${winnerIdx >= 0 && (win || two) ? "\uD83C\uDFC6" : "\uD83C\uDFC0"}</div><div class="title" style="color:${winnerIdx === 1 ? "var(--suns)" : winnerIdx === 0 ? "var(--good)" : "var(--muted)"}">${title}</div>
    <div class="stat">${msg}</div>${stats}
    ${rating ? `<div class="stat" style="font-size:34px">${"\u2B50".repeat(rating)}</div>` : ""}
    <div><button type="button" class="big orange" id="again">Play again</button> <button type="button" class="big" id="menu">Menu</button></div></div>`;
  $("#tS").classList.remove("active"); $("#tU").classList.remove("active");
  $("#again").onclick = () => { unlock(); startGame(mode); };
  $("#menu").onclick = () => showStart();
}

/* ---------------- chrome ---------------- */
$("#btnSound").onclick = (e) => { soundOn = !soundOn; e.target.textContent = "Sound: " + (soundOn ? "On" : "Off"); unlock(); };
$("#btnVoice").onclick = (e) => { voiceOn = !voiceOn; e.target.textContent = "Voice: " + (voiceOn ? "On" : "Off"); unlock(); try { speechSynthesis.cancel(); } catch (x) {} };
$("#btnMenu").onclick = () => { if (G && G.busy && !G.over) return; try { speechSynthesis.cancel(); } catch (x) {} showStart(); };
window.__fsc = { genQuestion, qFormCan, qFormGood, qBe, qTrue, qBuild, qWho, statementsFor, VERBS, STORY_CARDS, WHO_ITEMS, MAIN5, ALLV, SUBJECTS, get G() { return G; }, myCard };
showStart();
})();
